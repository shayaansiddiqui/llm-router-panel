name: Deploy LLM Gateway Console

on:
  push:
    branches:
      - main
    paths:
      - 'llm-gateway-console/**'
      - '.github/workflows/deploy-llm-gateway-console.yml'
  workflow_dispatch:

env:
  APP_DIR: llm-gateway-console
  SERVER_HOST: 168.231.74.54
  SERVER_USER: root
  SERVER_PORT: 22
  DEPLOY_PATH: ${{ vars.LLM_GATEWAY_DEPLOY_PATH || '/var/www/llm-gateway-console' }}
  SERVICE_NAME: ${{ vars.LLM_GATEWAY_SERVICE_NAME || 'llm-gateway-console' }}
  SERVICE_PORT: ${{ vars.LLM_GATEWAY_SERVICE_PORT || '8010' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        env:
          VITE_PUBLIC_GATEWAY_URL: ${{ vars.VITE_PUBLIC_GATEWAY_URL || 'https://ai.gettingstarted.app' }}
        run: npm run build

      - name: Move frontend build into backend static directory
        run: |
          rm -rf "${APP_DIR}/backend/app/static"
          mkdir -p "${APP_DIR}/backend/app/static"
          cp -R "${APP_DIR}/frontend/dist/." "${APP_DIR}/backend/app/static/"

      - name: Validate backend syntax
        run: >-
          python3 -m py_compile
          "${APP_DIR}/backend/app/main.py"
          "${APP_DIR}/backend/app/database.py"
          "${APP_DIR}/backend/app/schemas.py"
          "${APP_DIR}/backend/app/cloudflare.py"
          "${APP_DIR}/backend/app/node_naming.py"
          "${APP_DIR}/backend/app/node_provisioning.py"
          "${APP_DIR}/backend/app/node_routes.py"

      - name: Create deploy archive
        run: |
          tar -czf llm-gateway-console.tar.gz \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='frontend/.env' \
            --exclude='backend/.venv' \
            --exclude='backend/.env' \
            --exclude='backend/data' \
            -C "${APP_DIR}" .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: llm-gateway-console.tar.gz
          target: /tmp

      - name: Install and restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          SERVICE_PORT: ${{ env.SERVICE_PORT }}
          DATABASE_PATH: ${{ secrets.LLM_GATEWAY_DATABASE_PATH }}
          ADMIN_CORS_ORIGINS: ${{ secrets.LLM_GATEWAY_ADMIN_CORS_ORIGINS }}
          ADMIN_USERNAME: ${{ secrets.LLM_GATEWAY_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.LLM_GATEWAY_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.LLM_GATEWAY_ADMIN_SESSION_SECRET }}
          PROVIDER_REQUEST_TIMEOUT_SECONDS: ${{ secrets.LLM_GATEWAY_PROVIDER_TIMEOUT_SECONDS }}
          NODE_MANAGED_ZONE: ${{ vars.LLM_GATEWAY_NODE_MANAGED_ZONE || 'gettingstarted.app' }}
          NODE_AGENT_ORIGIN: ${{ vars.LLM_GATEWAY_NODE_AGENT_ORIGIN || 'http://127.0.0.1:17890' }}
          NODE_ENROLLMENT_TTL_SECONDS: ${{ vars.LLM_GATEWAY_NODE_ENROLLMENT_TTL_SECONDS || '900' }}
          NODE_HEARTBEAT_TIMEOUT_SECONDS: ${{ vars.LLM_GATEWAY_NODE_HEARTBEAT_TIMEOUT_SECONDS || '90' }}
          NODE_PUBLIC_MAX_TTL_SECONDS: ${{ vars.LLM_GATEWAY_NODE_PUBLIC_MAX_TTL_SECONDS || '86400' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.LLM_GATEWAY_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          envs: DEPLOY_PATH,SERVICE_NAME,SERVICE_PORT,DATABASE_PATH,ADMIN_CORS_ORIGINS,ADMIN_USERNAME,ADMIN_PASSWORD,ADMIN_SESSION_SECRET,PROVIDER_REQUEST_TIMEOUT_SECONDS,NODE_MANAGED_ZONE,NODE_AGENT_ORIGIN,NODE_ENROLLMENT_TTL_SECONDS,NODE_HEARTBEAT_TIMEOUT_SECONDS,NODE_PUBLIC_MAX_TTL_SECONDS,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_ZONE_ID,CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID,CLOUDFLARE_ACCESS_CLIENT_ID,CLOUDFLARE_ACCESS_CLIENT_SECRET
          script: |
            set -e

            RELEASE_DIR="/tmp/llm-gateway-console-release"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$DEPLOY_PATH"
            tar -xzf /tmp/llm-gateway-console.tar.gz -C "$RELEASE_DIR"

            if [ -z "$ADMIN_PASSWORD" ] || [ "$ADMIN_PASSWORD" = "admin" ]; then
              echo "LLM_GATEWAY_ADMIN_PASSWORD must be set to a non-default value."
              exit 1
            fi
            if [ -n "$ADMIN_SESSION_SECRET" ] && [ "${#ADMIN_SESSION_SECRET}" -lt 32 ]; then
              echo "LLM_GATEWAY_ADMIN_SESSION_SECRET must contain at least 32 characters."
              exit 1
            fi

            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name backend -exec rm -rf {} +
            mkdir -p "$DEPLOY_PATH/backend"
            find "$DEPLOY_PATH/backend" -mindepth 1 -maxdepth 1 ! -name .env ! -name .venv ! -name data -exec rm -rf {} +
            cp -a "$RELEASE_DIR/." "$DEPLOY_PATH/"
            mkdir -p "$DEPLOY_PATH/backend/data"
            chmod 700 "$DEPLOY_PATH/backend/data"

            if [ ! -f "$DEPLOY_PATH/backend/.env" ]; then
              install -m 600 /dev/null "$DEPLOY_PATH/backend/.env"
            fi

            set_env_value() {
              key="$1"
              value="$2"
              GSAI_ENV_KEY="$key" GSAI_ENV_VALUE="$value" python3 - "$DEPLOY_PATH/backend/.env" <<'PY'
            import os
            import re
            import sys
            from pathlib import Path

            path = Path(sys.argv[1])
            key = os.environ["GSAI_ENV_KEY"]
            value = os.environ["GSAI_ENV_VALUE"]
            if re.fullmatch(r"[A-Z][A-Z0-9_]*", key) is None:
                raise SystemExit("Invalid environment key")

            escaped = (
                value.replace("\\", "\\\\")
                .replace('"', '\\"')
                .replace("\n", "\\n")
                .replace("\r", "\\r")
            )
            replacement = f'{key}="{escaped}"\n'
            lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
            output = []
            replaced = False
            for line in lines:
                if line.startswith(f"{key}="):
                    if not replaced:
                        output.append(replacement)
                        replaced = True
                    continue
                output.append(line)
            if not replaced:
                output.append(replacement)
            temporary = path.with_suffix(".env.tmp")
            temporary.write_text("".join(output), encoding="utf-8")
            temporary.chmod(0o600)
            temporary.replace(path)
            PY
            }

            set_env_value DATABASE_PATH "${DATABASE_PATH:-./data/llm_gateway.db}"
            set_env_value ADMIN_CORS_ORIGINS "${ADMIN_CORS_ORIGINS:-https://ai.gettingstarted.app}"
            set_env_value ADMIN_USERNAME "${ADMIN_USERNAME:-admin}"
            set_env_value ADMIN_PASSWORD "$ADMIN_PASSWORD"
            set_env_value PROVIDER_REQUEST_TIMEOUT_SECONDS "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-60}"
            set_env_value NODE_MANAGED_ZONE "${NODE_MANAGED_ZONE:-gettingstarted.app}"
            set_env_value NODE_AGENT_ORIGIN "${NODE_AGENT_ORIGIN:-http://127.0.0.1:17890}"
            set_env_value NODE_ENROLLMENT_TTL_SECONDS "${NODE_ENROLLMENT_TTL_SECONDS:-900}"
            set_env_value NODE_HEARTBEAT_TIMEOUT_SECONDS "${NODE_HEARTBEAT_TIMEOUT_SECONDS:-90}"
            set_env_value NODE_PUBLIC_MAX_TTL_SECONDS "${NODE_PUBLIC_MAX_TTL_SECONDS:-86400}"

            set_env_if_present() {
              key="$1"
              value="$2"
              if [ -n "$value" ]; then
                set_env_value "$key" "$value"
              fi
            }

            set_env_if_present CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
            set_env_if_present CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
            set_env_if_present CLOUDFLARE_ZONE_ID "$CLOUDFLARE_ZONE_ID"
            set_env_if_present CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID "$CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID"
            set_env_if_present CLOUDFLARE_ACCESS_CLIENT_ID "$CLOUDFLARE_ACCESS_CLIENT_ID"
            set_env_if_present CLOUDFLARE_ACCESS_CLIENT_SECRET "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
            chmod 600 "$DEPLOY_PATH/backend/.env"
            if [ -n "$ADMIN_SESSION_SECRET" ]; then
              set_env_value ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"
            else
              existing_session_secret="$(grep '^ADMIN_SESSION_SECRET=' "$DEPLOY_PATH/backend/.env" | head -n 1 | cut -d= -f2- || true)"
              existing_session_secret="${existing_session_secret#\"}"
              existing_session_secret="${existing_session_secret%\"}"
              if [ "${#existing_session_secret}" -lt 32 ]; then
                set_env_value ADMIN_SESSION_SECRET "$(openssl rand -hex 32)"
              fi
            fi

            cd "$DEPLOY_PATH/backend"
            VENV_CHECK_DIR="/tmp/llm-gateway-console-venv-check"
            rm -rf "$VENV_CHECK_DIR"
            if ! python3 -m venv "$VENV_CHECK_DIR" >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3-venv
            fi
            rm -rf "$VENV_CHECK_DIR"

            if [ ! -x ".venv/bin/python" ] || [ ! -x ".venv/bin/pip" ]; then
              rm -rf .venv
              python3 -m venv .venv
            fi
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python -m py_compile app/*.py

            sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" > /dev/null <<EOF
            [Unit]
            Description=LLM Gateway Console
            After=network.target

            [Service]
            Type=simple
            User=${USER}
            WorkingDirectory=${DEPLOY_PATH}/backend
            EnvironmentFile=${DEPLOY_PATH}/backend/.env
            ExecStart=${DEPLOY_PATH}/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port ${SERVICE_PORT}
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"
            sleep 3
            curl -sf "http://127.0.0.1:${SERVICE_PORT}/health"
